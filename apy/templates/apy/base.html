<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій Веб-сайт{% endblock %}</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
         :root {
    --bg-color: #99c6e2;
    --card-bg: #ffffff;
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --nav-bg: rgba(255, 255, 255, 0.85);
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
}


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 0 auto;
}


.navbar {
    background-color: var(--nav-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    padding: 18px 0;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: var(--primary-color);
    text-decoration: none;
    letter-spacing: -0.5px;
    transition: transform 0.2s ease;
}

.logo:hover {
    transform: scale(1.02);
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 10px;
}

.nav-links a {
    text-decoration: none;
    color: var(--text-main);
    font-weight: 600;
    font-size: 15px;
    padding: 10px 16px;
    transition: all 0.25s ease;
    border-radius: 8px;
}

.nav-links a:hover {
    color: var(--primary-color);
    background-color: rgba(79, 70, 229, 0.06);
}


.dropdown {
    position: relative;
}

.dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background-color: var(--card-bg);
    border: 1px solid rgba(226, 232, 240, 0.8);
    box-shadow: var(--shadow);
    list-style: none;
    padding: 8px;
    min-width: 180px;
    border-radius: 10px;
    display: none;
    margin-top: 8px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.dropdown-menu li a {
    display: block;
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 6px;
}

.dropdown:hover .dropdown-menu {
    display: block;
    opacity: 1;
    transform: translateY(0);
}


.content {
    flex: 1;
    padding: 50px 0;
}

.card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(226, 232, 240, 0.5);
}

.card h1 {
    font-size: 32px;
    margin-bottom: 20px;
    color: var(--text-main);
    font-weight: 600;
}

.card p {
    font-size: 16px;
    line-height: 1.7;
    color: var(--text-muted);
}

.card ul {
    margin-left: 22px;
    margin-top: 15px;
}

.card li {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.text-center {
    text-align: center;
}

.footer {
    background-color: #0f172a;
    color: #94a3b8;
    text-align: center;
    padding: 25px 0;
    font-size: 14px;
    margin-top: auto;
    border-top: 1px solid #1e293b;
}


@media (max-width: 600px) {
    .nav-container {
        flex-direction: column;
        gap: 15px;
    }
    .nav-links {
        width: 100%;
        justify-content: center;
    }
    .card {
        padding: 25px;
    }
}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="{% url 'home' %}" class="logo">Мой Сайт</a>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Главная</a></li>
                <li class="dropdown">
                    <a href="#">Про меня ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="{% url 'biography' %}">Биография</a></li>
                        <li><a href="{% url 'facts' %}">Интересные факты</a></li>
                    </ul>
                </li>
                <li class="dropdown">
                    <a href="#">Мой город ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="{% url 'city_info' %}">Основные данные</a></li>
                        <li><a href="{% url 'city_places' %}">Интересные места</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    <main class="container content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>&copy; 2026 Все права защищены.</p>
    </footer>
</body>
</html>
